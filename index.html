<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tinyDJ Remote</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f0f0f;
            --bar: #0a0a0a;
            --card-bg: #1a1a1a;
            --btn-bg: #252525;
            --btn-hover: #303030;
            --line: #333;
            --line-2: #444;
            --text: #f2f2f2;
            --text-2: #d0d0d0;
            --muted: #888;
            --dim: #666;
            --ok: #8fbf8f;
            --warn: #d9b26a;
            --bad: #d98080;
            --accent: #bf00ff;
            --cyan: #00ffff;
            --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        *, ::before, ::after { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 400 16px/1.45 var(--font);
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 96px 16px 80px;
            transition: padding-bottom 0.2s ease;
        }
        :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
        .hidden { display: none !important; }

        /* --- NAVIGATION BARS --- */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: var(--bar);
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid #222;
        }
        .nav-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .nav-btn {
            display: block;
            min-width: 88px;
            padding: 11px 22px 12px;
            border-radius: 999px;
            background: var(--btn-bg);
            border: 1px solid var(--line-2);
            color: var(--text);
            font: 700 15px/1 var(--font);
            text-align: center;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .nav-btn:hover { background: var(--btn-hover); border-color: var(--muted); }

        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--bar);
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
            display: flex;
            align-items: center;
            z-index: 100;
            border-top: 1px solid #222;
            gap: 10px;
        }
        .bottom-bar label { margin: 0; }

        /* --- MAIN CARD --- */
        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 28px 22px 20px;
            border-radius: 28px;
            border: 1px solid var(--line);
            position: relative;
        }

        .ascii-container { display: flex; justify-content: center; width: 100%; margin-bottom: 18px; cursor: pointer; user-select: none; }
        .ascii-header {
            margin: 0;
            font-family: var(--mono);
            font-size: 11px;
            line-height: 1.15;
            font-weight: 800;
            text-align: left;
            white-space: pre;
            background: linear-gradient(to right, var(--accent), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-display { margin-bottom: 18px; text-align: center; }
        .main-display h1 {
            color: var(--text);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
            margin: 0;
        }
        .ip-text {
            color: var(--dim);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            margin: 8px 0 12px;
        }

        /* --- BATTERY (only when /status reports one: the R36S) --- */
        .battery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: -4px 0 12px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .battery.is-ok { color: var(--ok); }
        .battery.is-warn { color: var(--warn); }
        .battery.is-bad { color: var(--bad); }
        .battery-icon {
            position: relative;
            width: 24px;
            height: 12px;
            padding: 1.5px;
            border: 1.5px solid currentColor;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .battery-icon::after {
            content: "";
            position: absolute;
            right: -4px;
            top: 2.5px;
            width: 2px;
            height: 4px;
            border-radius: 0 1px 1px 0;
            background: currentColor;
        }
        .battery-fill {
            display: block;
            width: 0;
            height: 100%;
            border-radius: 1px;
            background: currentColor;
            transition: width 0.3s ease;
        }
        .battery-note { color: var(--muted); font-weight: 500; }
        .battery.is-bad .battery-note { color: var(--bad); }

        /* --- SEEK SLIDER STYLES --- */
        .seek-container { display: flex; flex-direction: column; gap: 6px; margin: 14px 0 4px; }
        .seek-time {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--muted);
        }
        .seek-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: var(--btn-bg);
            border: 1px solid var(--line);
            outline: none;
            cursor: pointer;
            margin: 8px 0;
        }
        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--text-2);
            cursor: pointer;
        }
        .seek-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--text-2);
            border: none;
            cursor: pointer;
        }

        .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        .ctrl-btn {
            background: var(--btn-bg);
            border: 1px solid var(--line-2);
            color: var(--text);
            padding: 20px 8px;
            border-radius: 18px;
            font: 600 15px/1 var(--font);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .ctrl-btn:hover { background: var(--btn-hover); border-color: var(--muted); }
        .ctrl-btn:active { background: var(--line-2); }
        .ctrl-btn.is-quiet { background: transparent; border-color: var(--line); color: var(--muted); }
        .ctrl-btn.is-quiet:hover { border-color: var(--muted); color: var(--text); }
        #playPauseBtn.hidden + .ctrl-btn { grid-column: 1 / -1; }
        .tv-btn { width: 100%; margin-bottom: 4px; }

        .action-btn {
            background: var(--text);
            color: var(--bg);
            border: 0;
            padding: 16px;
            border-radius: 14px;
            font: 700 15px/1 var(--font);
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            transition: opacity 0.15s;
        }
        .action-btn:hover { opacity: 0.88; }
        .btn-success { background: var(--ok) !important; color: #000 !important; }

        .card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }
        .settings-trigger {
            padding: 6px 8px;
            margin-right: -8px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--dim);
            font: 600 13px/1 var(--font);
            cursor: pointer;
            transition: color 0.15s;
        }
        .settings-trigger:hover { color: var(--text); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            z-index: 1000;
        }
        .modal-open { display: flex; }
        .modal {
            background: var(--card-bg);
            width: 100%;
            max-width: 360px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: 24px 22px;
            border-radius: 28px;
            border: 1px solid var(--line);
        }
        .modal h2 {
            color: var(--text);
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            margin: 0 0 18px;
        }

        label { display: block; font-size: 12px; margin-bottom: 6px; color: var(--muted); font-weight: 600; }
        input:not([type="range"]):not([type="checkbox"]) {
            width: 100%;
            padding: 11px 12px;
            background: #000;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: #fff;
            font: 400 15px/1.2 var(--font);
            outline: none;
            margin-bottom: 14px;
        }
        input:not([type="range"]):not([type="checkbox"]):focus { border-color: var(--muted); }

        /* --- TOGGLE VISIBILITY GRID --- */
        .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
        .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 10px 12px;
            min-width: 0;
            margin: 0;
            color: #ccc;
            cursor: pointer;
        }
        .toggle-item:hover { border-color: var(--line-2); }
        .toggle-item input[type="checkbox"] { flex-shrink: 0; margin: 0; cursor: pointer; accent-color: var(--text-2); }
        .toggle-item span {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #status {
            font-size: 13px;
            font-weight: 600;
            color: #555;
        }
        #status.is-ok { color: var(--ok); }
        #status.is-warn { color: var(--warn); }
        #status.is-bad { color: var(--bad); }
        #status.is-busy { color: var(--text-2); }

        .cast-input { flex-grow: 1; margin-bottom: 0 !important; }
        .cast-send {
            background: var(--text);
            color: var(--bg);
            border: 0;
            padding: 11px 16px;
            border-radius: 10px;
            font: 700 14px/1 var(--font);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="nav-group">
            <a id="bit-link" href="#" target="_blank" class="nav-btn">Transfers</a>
            <a id="box-link" href="#" target="_blank" class="nav-btn">TreenFlix</a>
        </div>
    </div>

    <div class="card">
        <div class="ascii-container" id="asciiContainer" title="Double tap for nerd stats">
            <pre class="ascii-header">
   __  _                ____    _
  / /_(_)___  __  __   / __ \  (_)
 / __/ / __ \/ / / /  / / / / / /
/ /_/ / / / / /_/ /  / /_/ / / /
\__/_/_/ /_/\__, /  /_____/_/ /
           /____/        /___/   </pre>
        </div>
        <div class="main-display">
            <h1>Controls</h1>
            <p id="ip-display" class="ip-text">IP: --.--.--.--</p>
            <p id="battery" class="battery hidden">
                <span class="battery-icon" aria-hidden="true"><span class="battery-fill" id="batteryFill"></span></span>
                <span id="batteryText">--%</span>
                <span id="batteryNote" class="battery-note"></span>
            </p>

            <div id="seekContainer" class="seek-container hidden">
                <input type="range" id="seekSlider" class="seek-slider" min="0" max="100" value="0" step="1">
                <div class="seek-time">
                    <span id="currTime">00:00</span>
                    <span id="durTime">00:00</span>
                </div>
            </div>
        </div>
        <div class="nav-grid">
            <button class="ctrl-btn" onclick="hitEndpoint('ui/prev')">Prev</button>
            <button class="ctrl-btn" onclick="hitEndpoint('ui/next')">Next</button>
        </div>
        <div class="nav-grid">
            <button class="ctrl-btn hidden" id="playPauseBtn" onclick="hitEndpoint('pause')">Play/Pause</button>
            <button class="ctrl-btn" onclick="hitEndpoint('epg')">EPG</button>
        </div>
        <button class="ctrl-btn is-quiet tv-btn" id="tvBtn" onclick="tvButton()">TV off</button>
        <div class="card-foot">
            <div id="status">Ready</div>
            <button class="settings-trigger" onclick="toggleModal()">Settings</button>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h2>Settings</h2>

            <label for="ssid">WiFi SSID</label>
            <input type="text" id="ssid" placeholder="Network Name" value="Jellicoiet">

            <label for="pass">WiFi passphrase</label>
            <input type="password" id="pass" placeholder="••••••••" value="qwertyui">

            <div id="hostIpRow">
                <label for="hostIp">Host IP</label>
                <input type="text" id="hostIp" placeholder="tinydj.local" onchange="manualIpChange(this.value)">
            </div>

            <label>Show on remote</label>
            <div class="toggle-grid">
                <label class="toggle-item">
                    <input type="checkbox" id="checkSeek" onchange="updateVisibility()"> <span>Seek bar</span>
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="checkHostIp" onchange="updateVisibility()"> <span>Host IP</span>
                </label>
                <label class="toggle-item">
                    <input type="checkbox" id="checkCast" onchange="updateVisibility()"> <span>Cast URL</span>
                </label>
            </div>

            <button class="action-btn" id="syncBtn" onclick="oneClickSync()">Sync WiFi & get IP</button>
            <button class="ctrl-btn is-quiet" style="width: 100%; margin-top: 10px; padding: 14px; font-size: 15px;" onclick="toggleModal()">Close</button>
        </div>
    </div>

    <div class="bottom-bar hidden" id="bottomBar">
        <label for="castUrl">Cast</label>
        <input type="text" id="castUrl" class="cast-input" placeholder="Paste URL and press Enter…">
        <button class="cast-send" onclick="handleCast()">Send</button>
    </div>

    <script>
        const hostIpInput = document.getElementById('hostIp');
        const ipDisplay = document.getElementById('ip-display');
        const syncBtn = document.getElementById('syncBtn');
        const castUrlInput = document.getElementById('castUrl');
        const seekSlider = document.getElementById('seekSlider');
        const currTimeLabel = document.getElementById('currTime');
        const durTimeLabel = document.getElementById('durTime');
        const asciiContainer = document.getElementById('asciiContainer');

        const SERVICE_UUID = '12345678-1234-5678-1234-56789abcdef0';
        const CHAR_IP_UUID = '12345678-1234-5678-1234-56789abcdef1';
        const CHAR_SSID_UUID = '12345678-1234-5678-1234-56789abcdef2';
        const CHAR_PASS_UUID = '12345678-1234-5678-1234-56789abcdef3';

        // The board's LED warns at this charge too (mgr's led.zig): Wi-Fi drops
        // out on a low battery.
        const BATTERY_LOW_PCT = 20;
        const BATTERY_WARN_PCT = 40;

        let activeDevice = null;
        let isDraggingSeek = false;
        let suppressPollUntil = 0;
        let tvIsOn = true;
        let hasStatusData = false;
        let isLiveStream = false;
        let isPaused = false;
        let lastAsciiClickTime = 0;

        // Double tap / double click listener for ASCII art
        asciiContainer.addEventListener('click', () => {
            const currentTime = Date.now();
            if (currentTime - lastAsciiClickTime < 300) {
                hitEndpoint('key/nerd');
                lastAsciiClickTime = 0;
            } else {
                lastAsciiClickTime = currentTime;
            }
        });

        function formatTime(s) {
            if (isNaN(s) || s < 0) return "00:00";
            const mins = Math.floor(s / 60);
            const secs = Math.floor(s % 60);
            const hrs = Math.floor(mins / 60);
            const remMins = mins % 60;
            if (hrs > 0) {
                return `${hrs}:${remMins < 10 ? '0' : ''}${remMins}:${secs < 10 ? '0' : ''}${secs}`;
            }
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // The battery row: shown only while /status carries a battery with a
        // charge (the R36S); a board with none, or no answer, hides it.
        // /status's battery is {percent, mv, charge}, each null when unread;
        // charge is charging, discharging, full or not_charging.
        function updateBattery(battery) {
            const row = document.getElementById('battery');
            const pct = battery && typeof battery.percent === 'number' ? battery.percent : null;
            if (pct === null) {
                row.classList.add('hidden');
                return;
            }
            const charging = battery.charge === 'charging';
            const full = battery.charge === 'full';
            const tone = charging || full ? 'ok'
                : pct <= BATTERY_LOW_PCT ? 'bad'
                : pct <= BATTERY_WARN_PCT ? 'warn'
                : 'ok';
            let note = '';
            if (charging) note = 'Charging';
            else if (full) note = 'Full';
            else if (pct <= BATTERY_LOW_PCT) note = 'Low: Wi-Fi may drop';

            row.className = `battery is-${tone}`;
            document.getElementById('batteryFill').style.width = `${Math.max(0, Math.min(100, pct))}%`;
            document.getElementById('batteryText').innerText = `${pct}%`;
            document.getElementById('batteryNote').innerText = note;
            const volts = typeof battery.mv === 'number' ? ` · ${(battery.mv / 1000).toFixed(2)} V` : '';
            row.title = `Battery ${pct}%${volts}`;
            row.setAttribute('aria-label', `Battery ${pct}%${note ? ', ' + note : ''}`);
        }

        function updateSeekContainerVisibility() {
            const showSeekSetting = document.getElementById('checkSeek').checked;
            const shouldShow = showSeekSetting && hasStatusData && !isLiveStream;
            document.getElementById('seekContainer').classList.toggle('hidden', !shouldShow);
            updatePlayPauseVisibility();
        }

        // Play/Pause shows for streams with a length, and whenever paused so
        // a paused live stream can always be resumed.
        function updatePlayPauseVisibility() {
            const shouldShow = hasStatusData && (!isLiveStream || isPaused);
            document.getElementById('playPauseBtn').classList.toggle('hidden', !shouldShow);
        }

        async function fetchStatus() {
            if (Date.now() < suppressPollUntil || isDraggingSeek) return;
            const ip = hostIpInput.value.trim();
            if (!ip || ip === "--.--.--.--") {
                hasStatusData = false;
                updateSeekContainerVisibility();
                updateBattery(null);
                return;
            }

            try {
                const res = await fetch(`http://${ip}:7979/status`);
                if (res.ok) {
                    const data = await res.json();
                    hasStatusData = true;
                    isLiveStream = !!data.live;
                    isPaused = !!data.paused;
                    updateSeekContainerVisibility();
                    updateBattery(data.battery);

                    if (typeof data.tv_on === 'boolean') {
                        tvIsOn = data.tv_on;
                        updateTvButton();
                    }

                    const playPauseBtn = document.getElementById('playPauseBtn');
                    if (playPauseBtn && data.paused !== undefined) {
                        playPauseBtn.innerText = data.paused ? "Play" : "Pause";
                    }

                    const statusEl = document.getElementById('status');
                    if (statusEl && ["Ready", "Sent", "Playing", "Paused", "Buffering…"].includes(statusEl.innerText)) {
                        if (data.ready === 0) {
                            updateStatus("Buffering…", "warn");
                        } else if (data.paused) {
                            updateStatus("Paused");
                        } else {
                            updateStatus("Playing", "ok");
                        }
                    }

                    if (!isDraggingSeek) {
                        const duration = Math.floor(parseFloat(data.duration) || 0);
                        const position = Math.floor(parseFloat(data.position) || 0);

                        seekSlider.max = Math.max(duration, 1);
                        seekSlider.value = Math.min(position, seekSlider.max);
                        currTimeLabel.innerText = formatTime(position);
                        durTimeLabel.innerText = formatTime(duration);
                    }
                } else {
                    hasStatusData = false;
                    updateSeekContainerVisibility();
                    updateBattery(null);
                }
            } catch(e) {
                hasStatusData = false;
                updateSeekContainerVisibility();
                updateBattery(null);
            }
        }

        seekSlider.addEventListener('input', (e) => {
            isDraggingSeek = true;
            currTimeLabel.innerText = formatTime(e.target.value);
        });

        ['pointerup', 'touchend', 'mouseup'].forEach(evt => {
            window.addEventListener(evt, () => {
                if (isDraggingSeek) {
                    setTimeout(() => { isDraggingSeek = false; }, 600);
                }
            });
        });

        seekSlider.addEventListener('change', (e) => {
            const targetSec = Math.round(e.target.value);
            const ip = hostIpInput.value.trim();
            suppressPollUntil = Date.now() + 5000;
            isDraggingSeek = false;

            if (!ip || ip === "--.--.--.--") return updateStatus("No IP set", "bad");

            updateStatus(`Seeking to ${formatTime(targetSec)}…`, "busy");
            fetch(`http://${ip}:7979/seek/${targetSec}`, { mode: 'no-cors' })
                .then(() => {
                    updateStatus("Sent", "ok");
                    setTimeout(() => fetchStatus(), 1000);
                })
                .catch(() => updateStatus("Offline", "bad"));
        });

        function updateVisibility() {
            const showSeek = document.getElementById('checkSeek').checked;
            const showHostIp = document.getElementById('checkHostIp').checked;
            const showCast = document.getElementById('checkCast').checked;

            updateSeekContainerVisibility();

            document.getElementById('hostIpRow').classList.toggle('hidden', !showHostIp);

            const bottomBar = document.getElementById('bottomBar');
            bottomBar.classList.toggle('hidden', !showCast);
            document.body.style.paddingBottom = showCast ? '80px' : '20px';

            localStorage.setItem('tinyDj_showSeek', showSeek);
            localStorage.setItem('tinyDj_showHostIp', showHostIp);
            localStorage.setItem('tinyDj_showCast', showCast);
        }

        function toggleModal() {
            document.getElementById('settingsModal').classList.toggle('modal-open');
        }

        function manualIpChange(val) {
            localStorage.setItem('tinyDjHostIp', val);
            ipDisplay.innerText = `IP: ${val}`;
            updateLinks(val);
            fetchStatus();
        }

        function updateLinks(ip) {
            if (ip && ip.includes('.')) {
                document.getElementById('box-link').href = `http://${ip}:8303`;
                document.getElementById('bit-link').href = `http://${ip}:3030`;            }
        }

        /* --- SIMPLIFIED BLUETOOTH FUNCTIONS --- */
        async function getService() {
            if (activeDevice && activeDevice.gatt.connected) {
                return activeDevice.gatt.getPrimaryService(SERVICE_UUID);
            }
            activeDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: [SERVICE_UUID] }]
            });
            const server = await activeDevice.gatt.connect();
            return server.getPrimaryService(SERVICE_UUID);
        }

        async function oneClickSync() {
            const ssid = document.getElementById('ssid').value;
            const pass = document.getElementById('pass').value;

            if(!ssid || !pass) return updateStatus("SSID and passphrase required", "bad");

            try {
                updateStatus("Connecting to device…", "busy");
                syncBtn.innerText = "Connecting…";

                const service = await getService();
                const enc = new TextEncoder();

                await (await service.getCharacteristic(CHAR_SSID_UUID)).writeValue(enc.encode(ssid));
                await (await service.getCharacteristic(CHAR_PASS_UUID)).writeValue(enc.encode(pass));

                updateStatus("Waiting for IP…", "busy");
                syncBtn.innerText = "Waiting for IP…";

                const ipChar = await service.getCharacteristic(CHAR_IP_UUID);

                while (true) {
                    const value = await ipChar.readValue();
                    const ip = new TextDecoder().decode(value);

                    if (ip.includes(".") && !ip.toLowerCase().includes("connecting")) {
                        manualIpChange(ip);
                        hostIpInput.value = ip;
                        syncBtn.innerText = "✓ Connected";
                        syncBtn.classList.add('btn-success');
                        updateStatus("Connected: " + ip, "ok");

                        setTimeout(() => {
                            toggleModal();
                            syncBtn.classList.remove('btn-success');
                            syncBtn.innerText = "Sync WiFi & get IP";
                            updateStatus("Ready");
                        }, 1500);
                        break;
                    }

                    await new Promise(r => setTimeout(r, 2000));
                }
            } catch (e) {
                updateStatus("Bluetooth error", "bad");
                syncBtn.innerText = "Sync WiFi & get IP";
            }
        }

        function handleCast() {
            const url = castUrlInput.value.trim();
            const ip = hostIpInput.value.trim();
            if(!url || !ip || ip === "--.--.--.--") return updateStatus("Need a URL and IP", "bad");
            updateStatus("Casting…", "busy");
            fetch(`http://${ip}:7979/${encodeURIComponent(url)}`, { mode: 'no-cors' })
                .then(() => { updateStatus("Cast sent", "ok"); castUrlInput.value = ""; setTimeout(() => updateStatus("Ready"), 2000); })
                .catch(() => updateStatus("Failed", "bad"));
        }

        // dj's power key, which each board takes its own way: over CEC the
        // television's standby, or its input 4 while it is off; on the R36S
        // the handheld's standby (screen and sound off, paused), which the
        // same press undoes. /status's tv_on says which it is in now.
        function tvButton() {
            hitEndpoint('key/power');
            tvIsOn = !tvIsOn;
            updateTvButton();
        }

        function updateTvButton() {
            const tvBtn = document.getElementById('tvBtn');
            if (tvBtn) tvBtn.innerText = tvIsOn ? "TV off" : "TV on";
        }

        function hitEndpoint(p) {
            const ip = hostIpInput.value.trim();
            if (p === 'pause') {
                suppressPollUntil = Date.now() + 4000;
            }

            // POST for the key/ endpoints (key/nerd, key/power), GET for others
            const options = { mode: 'no-cors' };
            if (p.startsWith('key/')) {
                options.method = 'POST';
            }

            updateStatus(`${p}…`, "busy");
            fetch(`http://${ip}:7979/${p}`, options)
                .then(() => { updateStatus("Sent", "ok"); setTimeout(() => updateStatus("Ready"), 1500); })
                .catch(() => updateStatus("Offline", "bad"));
        }

        window.onload = () => {
            const saved = localStorage.getItem('tinyDjHostIp') || "tinydj.local";
            hostIpInput.value = saved;
            ipDisplay.innerText = `IP: ${saved}`;
            updateLinks(saved);

            const seekOn = localStorage.getItem('tinyDj_showSeek') !== 'false';
            const hostIpOn = localStorage.getItem('tinyDj_showHostIp') === 'true';
            const castOn = localStorage.getItem('tinyDj_showCast') === 'true';

            document.getElementById('checkSeek').checked = seekOn;
            document.getElementById('checkHostIp').checked = hostIpOn;
            document.getElementById('checkCast').checked = castOn;
            updateVisibility();

            fetchStatus();
            setInterval(fetchStatus, 5000);
        };

        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft') hitEndpoint('ui/prev');
            if (e.key === 'ArrowUp') hitEndpoint('epg');
            if (e.key === 'ArrowRight') hitEndpoint('ui/next');
            if (e.code === 'Space') { e.preventDefault(); hitEndpoint('pause'); }
        });

        castUrlInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleCast(); });

        // tone: ok | warn | bad | busy, or omitted for muted
        function updateStatus(msg, tone = "") {
            const s = document.getElementById('status');
            s.innerText = msg;
            s.className = tone ? `is-${tone}` : '';
        }
    </script>
</body>
</html>
